<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" width="1240" height="590" role="img" aria-label="Runtime: the recording GUI starts one child process at a time; devices are addressed by stable IDs; previews and logs go through files" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c7c8e"/></marker><marker id="ns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c7c8e"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a98bff"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a98bff"/></marker></defs><rect width="100%" height="100%" fill="#101016"/><rect x="20" y="20" width="300" height="520" rx="14" fill="#18181f"/><text x="36" y="46" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">DEVICES (BY-ID)</text><rect x="360" y="20" width="500" height="520" rx="14" fill="#18181f"/><text x="376" y="46" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">PROCESSES</text><rect x="900" y="20" width="330" height="520" rx="14" fill="#18181f"/><text x="916" y="46" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">FILES AND READERS</text><rect x="36" y="64" width="268" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="170.0" y="85.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Follower serial</text><text x="170.0" y="103.0" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" fill="#a4a4b4">...5AE6083026</text><rect x="36" y="134" width="268" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="170.0" y="155.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Leader serial</text><text x="170.0" y="173.0" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" fill="#a4a4b4">...5B79015054</text><rect x="36" y="234" width="268" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="170.0" y="255.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Side cam C270</text><text x="170.0" y="273.0" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" fill="#a4a4b4">/dev/v4l/by-id/...C270</text><rect x="36" y="304" width="268" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="170.0" y="325.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Wrist cam</text><text x="170.0" y="343.0" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" fill="#a4a4b4">/dev/v4l/by-id/...Generic</text><rect x="36" y="384" width="268" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="170.0" y="405.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Shaker serial</text><text x="170.0" y="423.0" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" fill="#a4a4b4">...5B91044141</text><rect x="380" y="64" width="460" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="85.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">record_gui.py  (uvicorn 127.0.0.1:8200)</text><text x="610.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">browser buttons: record, run, judge, shake</text><rect x="390" y="140" width="440" height="320" rx="10" fill="none" stroke="#7c7c8e" stroke-width="1" stroke-dasharray="3 4"/><text x="404" y="160" text-anchor="start" font-size="11.5" font-weight="400" fill="#a4a4b4">child processes, started one at a time (lock)</text><path d="M610.0,118 L610.0,140" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="618.0" y="134" text-anchor="start" font-size="11.5" fill="#a4a4b4">spawns</text><rect x="410" y="172" width="400" height="68" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="200.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">record_preview.py -&gt; lerobot-record / rollout</text><text x="610.0" y="218.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">gripper floor 6/100, torque retry x3</text><rect x="410" y="280" width="400" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="301.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">cam_preview.py</text><text x="610.0" y="319.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">idle only; writes the same preview files</text><rect x="410" y="384" width="400" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="405.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">deck_shaker.py</text><text x="610.0" y="423.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">keys on stdin; stops when the pipe closes</text><path d="M304,91 L352,91 L352,186 L410,186" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)" marker-start="url(#ns)"/><path d="M304,161 L344,161 L344,198 L410,198" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><path d="M304,261 L336,261 L336,212 L410,212" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><path d="M304,331 L348,331 L348,226 L410,226" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><path d="M304,411 L410,411" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)" marker-start="url(#ns)"/><rect x="916" y="64" width="288" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="1060.0" y="85.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">/dev/shm/plugbot_cam/*.jpg</text><text x="1060.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">latest frames, about 15 fps</text><rect x="916" y="172" width="288" height="68" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="1060.0" y="200.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">data/rollouts/&lt;time&gt;/</text><text x="1060.0" y="218.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">meta, joints, frames, result.json</text><rect x="916" y="280" width="288" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="1060.0" y="301.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">tally_rollouts.py</text><text x="1060.0" y="319.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">per-checkpoint success, Wilson CI</text><rect x="916" y="384" width="288" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="1060.0" y="405.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">/dev/shm/plugbot_shaker.json</text><text x="1060.0" y="423.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">deck height, commanded + measured</text><rect x="916" y="464" width="288" height="54" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="1060.0" y="485.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">booth.py  (:8300)</text><text x="1060.0" y="503.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">audience screen, read-only</text><path d="M810,182 L880,182 L880,91 L916,91" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="884" y="136" text-anchor="start" font-size="11.5" fill="#a4a4b4">preview</text><path d="M810,222 L916,222" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="883.0" y="215" text-anchor="middle" font-size="11.5" fill="#a4a4b4">run log</text><path d="M810,411 L916,411" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="883.0" y="404" text-anchor="middle" font-size="11.5" fill="#a4a4b4">writes</text><path d="M1060.0,240 L1060.0,280" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="1068.0" y="264" text-anchor="start" font-size="11.5" fill="#a4a4b4">reads</text><path d="M1204,91 L1218,91 L1218,491 L1204,491" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="1214" y="456" text-anchor="end" font-size="11.5" fill="#a4a4b4">reads</text><path d="M1204,411 L1218,411" fill="none" stroke="#7c7c8e" stroke-width="1.5"/><text x="20" y="566" text-anchor="start" font-size="12" font-weight="400" fill="#a4a4b4">Safety in code: one start at a time (lock), gripper command floor, torque-write retries, deck stops if the GUI dies, devices by serial number, not by /dev order.</text></svg>