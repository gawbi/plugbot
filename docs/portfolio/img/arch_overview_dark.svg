<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="PlugBot system overview: real hardware, laptop software and simulation, and the data that moves between them" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif"><defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c7c8e"/></marker><marker id="ns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c7c8e"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a98bff"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a98bff"/></marker></defs><rect width="100%" height="100%" fill="#101016"/><rect x="20" y="56" width="330" height="510" rx="14" fill="#18181f"/><text x="36" y="82" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">REAL HARDWARE</text><rect x="430" y="56" width="360" height="510" rx="14" fill="#18181f"/><text x="446" y="82" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">LAPTOP (RTX 5070, UBUNTU)</text><rect x="840" y="56" width="370" height="510" rx="14" fill="#18181f"/><text x="856" y="82" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#a4a4b4">SIMULATION</text><rect x="40" y="100" width="290" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="185.0" y="122.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">SO-101 leader arm</text><text x="185.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">a person demonstrates</text><rect x="40" y="186" width="290" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="185.0" y="208.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">SO-101 follower + IEC plug cover</text><text x="185.0" y="226.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">6 x STS3215 servos, 3D-printed</text><rect x="40" y="272" width="290" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="185.0" y="294.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Side camera + wrist camera</text><text x="185.0" y="312.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">640 x 480, 30 fps</text><rect x="40" y="358" width="290" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="185.0" y="380.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Shaking deck</text><text x="185.0" y="398.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">1 x STS3215, sine or irregular waves</text><rect x="40" y="444" width="290" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="185.0" y="466.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Photobox socket</text><text x="185.0" y="484.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">black box, white IEC-style socket</text><rect x="450" y="100" width="320" height="100" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="144.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">LeRobot record / rollout</text><text x="610.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">child process with safety patches</text><rect x="450" y="230" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="252.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Datasets + ACT training</text><text x="610.0" y="270.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">LeRobot 0.6.1, 134 real demos</text><rect x="450" y="316" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="338.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Run logs + human judgement</text><text x="610.0" y="356.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">result.json per run</text><rect x="450" y="402" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="424.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Tally</text><text x="610.0" y="442.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">success / trials, Wilson 95% CI</text><rect x="450" y="488" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2"/><text x="610.0" y="510.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Recording GUI  (:8200)</text><text x="610.0" y="528.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">starts record / run / shaker, one at a time</text><rect x="860" y="100" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1020.0" y="122.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">MuJoCo strategy study</text><text x="1020.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">static / follow / predict</text><rect x="860" y="186" width="320" height="56" rx="9" fill="#241c3a" stroke="#a98bff" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1020.0" y="208.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Isaac Sim photobox twin</text><text x="1020.0" y="226.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">replays real joints, renders cameras</text><rect x="860" y="272" width="320" height="56" rx="9" fill="#1d1d26" stroke="#7c7c8e" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1020.0" y="294.0" text-anchor="middle" font-size="14" font-weight="650" fill="#ececf2">Isaac Sim UR10e scale-up</text><text x="1020.0" y="312.0" text-anchor="middle" font-size="11.5" fill="#a4a4b4">small leader drives industrial arm</text><path d="M330,128 L450,128" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="390" y="121" text-anchor="middle" font-size="11.5" fill="#a4a4b4">joint positions</text><path d="M330,214 L400,214 L400,160 L450,160" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)" marker-start="url(#ns)"/><text x="334" y="207" text-anchor="start" font-size="11.5" fill="#a4a4b4">goal / state</text><path d="M330,300 L420,300 L420,188 L450,188" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="334" y="293" text-anchor="start" font-size="11.5" fill="#a4a4b4">frames</text><path d="M450,516 L390,516 L390,386 L330,386" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="334" y="379" text-anchor="start" font-size="11.5" fill="#a4a4b4">keys via pipe</text><path d="M770,516 L782,516 L782,344 L770,344" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="786" y="434" text-anchor="start" font-size="11.5" fill="#a4a4b4">judge</text><path d="M580,200 L580,230" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="572" y="220" text-anchor="end" font-size="11.5" fill="#a4a4b4">episodes</text><path d="M640,230 L640,200" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="648" y="220" text-anchor="start" font-size="11.5" fill="#a4a4b4">policy</text><path d="M460,200 L460,208 L440,208 L440,344 L450,344" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="444" y="298" text-anchor="start" font-size="11.5" fill="#a4a4b4">logs</text><path d="M610,372 L610,402" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><path d="M770,248 L815,248 L815,208 L860,208" fill="none" stroke="#a98bff" stroke-width="1.5" marker-end="url(#a)"/><text x="774" y="241" text-anchor="start" font-size="11.5" fill="#a98bff">real joints</text><path d="M860,228 L830,228 L830,272 L770,272" fill="none" stroke="#a98bff" stroke-width="1.5" marker-end="url(#a)"/><text x="776" y="288" text-anchor="start" font-size="11.5" fill="#a98bff">renders</text><path d="M185,100 L185,26 L1222,26 L1222,300 L1180,300" fill="none" stroke="#7c7c8e" stroke-width="1.5" marker-end="url(#n)"/><text x="700" y="19" text-anchor="middle" font-size="11.5" fill="#a4a4b4">live teleop: leader joints retargeted to a full-size UR10e (simulation)</text><text x="20" y="570" text-anchor="start" font-size="12" font-weight="400" fill="#a4a4b4">Dashed = simulation. Purple = Sim-to-Real path: robot motion comes from real demonstrations, camera images are rendered.</text><text x="20" y="590" text-anchor="start" font-size="12" font-weight="400" fill="#a4a4b4">Both policies run on the same real follower arm and are judged the same way.</text></svg>